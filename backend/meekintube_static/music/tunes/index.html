<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="description" content="meekin Tunes — ฟังเพลง เพลย์ลิสต์ และศิลปินที่คุณชอบ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tunes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>meekin Tunes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body class="m-none">
  <!-- desktop side navigation (filled by app.js) -->
  <nav id="side" aria-label="เมนูหลัก"></nav>

  <!-- pages render here -->
  <main id="main" tabindex="-1"></main>

  <!-- collapsed player: song card + a 200x200 slot the video host sits on -->
  <div id="dock" aria-label="กำลังเล่น"></div>

  <!-- mobile bottom navigation -->
  <nav id="tabs" aria-label="เมนูหลัก"></nav>

  <!-- full-screen now playing -->
  <section id="np" aria-hidden="true" aria-label="กำลังเล่น"></section>

  <!-- menus and dialogs: always below the video host, placed beside it -->
  <div id="modal"><div class="mb" data-a="modal-close"></div><div class="mp" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- The video host. Attached to the player once; only its CSS position/size ever changes.
       Nothing is ever drawn above it. -->
  <div id="ph"></div>

  <script src="../core.js?v=5"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
