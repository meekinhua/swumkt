  <symbol id="i-mood" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/></symbol>

<aside id="side" aria-label="เมนูหลัก">
  <button class="brand" data-go="home" aria-label="meekin Music หน้าแรก"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg><span class="wm"><b>meekin</b> Music</span></button>
  <nav class="side-nav">
    <button data-go="home" data-tab="home"><svg class="ic o" aria-hidden="true"><use href="#i-home"/></svg><svg class="ic f" aria-hidden="true"><use href="#i-home-f"/></svg><span>หน้าแรก</span></button>
    <button data-go="explore" data-tab="explore"><svg class="ic o" aria-hidden="true"><use href="#i-compass"/></svg><svg class="ic f" aria-hidden="true"><use href="#i-compass-f"/></svg><span>สำรวจ</span></button>
    <button data-go="library" data-tab="library"><svg class="ic o" aria-hidden="true"><use href="#i-lib"/></svg><svg class="ic f" aria-hidden="true"><use href="#i-lib-f"/></svg><span>คลังเพลง</span></button>
  </nav>
  <div class="side-sep"></div>
  <button class="side-new" data-act="newpl"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>เพลย์ลิสต์ใหม่</span></button>
  <div id="sidePl" class="side-pl"></div>
</aside>

<header id="top"></header>

<main id="view" tabindex="-1"></main>

<div id="dock" aria-label="เครื่องเล่นแบบย่อ">
  <div id="mini">
    <div class="mini-info" data-act="opennp" role="button" tabindex="0" aria-label="เปิดหน้ากำลังเล่น">
      <div class="mini-t" id="miniT"></div>
      <div class="mini-a" id="miniA"></div>
    </div>
    <div class="hint mini-hint" id="miniHint" hidden><span>แตะที่วิดีโอเพื่อเริ่มเล่น</span><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></div>
    <button class="ic-btn like d-only" id="miniLike" data-act="like" aria-label="ถูกใจ" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></button>
    <div class="mini-prog m-only" aria-hidden="true"><i id="miniProg"></i></div>
    <div class="seek mini-seek d-only">
      <span class="tm" id="miniCur">0:00</span>
      <input type="range" id="miniSeek" min="0" max="1000" step="1" value="0" aria-label="ตำแหน่งเพลง">
      <span class="tm" id="miniDur">0:00</span>
    </div>
    <div class="mini-ctrls">
      <button class="ic-btn d-only" data-act="shuffle" aria-label="สุ่มเพลง: ปิด" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg></button>
      <button class="ic-btn" data-act="prev" aria-label="เพลงก่อนหน้า"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg></button>
      <button class="ic-btn pp" data-act="toggle" aria-label="เล่น/หยุดชั่วคราว"><svg class="ic i-pl" aria-hidden="true"><use href="#i-play"/></svg><svg class="ic i-pa" aria-hidden="true"><use href="#i-pause"/></svg></button>
      <button class="ic-btn" data-act="next" aria-label="เพลงถัดไป"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
      <button class="ic-btn d-only" data-act="repeat" aria-label="เล่นซ้ำ: ปิด"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg></button>
      <button class="ic-btn d-only" data-act="opennp" aria-label="เปิดหน้ากำลังเล่น"><svg class="ic" aria-hidden="true"><use href="#i-chev-up"/></svg></button>
    </div>
  </div>
</div>

<nav id="nav" aria-label="เมนูหลัก">
  <button data-go="home" data-tab="home"><svg class="ic o" aria-hidden="true"><use href="#i-home"/></svg><svg class="ic f" aria-hidden="true"><use href="#i-home-f"/></svg><span>หน้าแรก</span></button>
  <button data-go="explore" data-tab="explore"><svg class="ic o" aria-hidden="true"><use href="#i-compass"/></svg><svg class="ic f" aria-hidden="true"><use href="#i-compass-f"/></svg><span>สำรวจ</span></button>
  <button data-go="library" data-tab="library"><svg class="ic o" aria-hidden="true"><use href="#i-lib"/></svg><svg class="ic f" aria-hidden="true"><use href="#i-lib-f"/></svg><span>คลังเพลง</span></button>
</nav>

<section id="np" aria-label="กำลังเล่น" aria-hidden="true">
  <div class="np-bg" aria-hidden="true"><img id="npBgImg" alt=""></div>
  <div class="np-head">
    <button class="ic-btn" data-act="closenp" aria-label="ย่อเครื่องเล่น"><svg class="ic" aria-hidden="true"><use href="#i-chev-down"/></svg></button>
    <div class="np-tag">วิดีโอ</div>
    <button class="ic-btn" data-act="npmore" aria-label="ตัวเลือกเพิ่มเติม"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
  </div>
  <div class="np-body">
    <div class="np-left">
      <div class="np-slot" aria-hidden="true"></div>
      <div class="np-ctl">
        <div class="hint np-hint" id="npHint" hidden><svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg><span>แตะที่วิดีโอเพื่อเริ่มเล่น</span></div>
        <div class="np-info">
          <div class="np-txt">
            <div class="np-t" id="npT"></div>
            <button class="np-a" id="npA" data-act="npartist"></button>
          </div>
          <button class="ic-btn like" id="npLike" data-act="like" aria-label="ถูกใจ" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></button>
        </div>
        <div class="seek np-seek">
          <input type="range" id="npSeek" min="0" max="1000" step="1" value="0" aria-label="ตำแหน่งเพลง">
          <div class="times"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>
        </div>
        <div class="np-ctrls">
          <button class="ic-btn" data-act="shuffle" aria-label="สุ่มเพลง: ปิด" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg></button>
          <button class="ic-btn big" data-act="prev" aria-label="เพลงก่อนหน้า"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg></button>
          <button class="pp xl" data-act="toggle" aria-label="เล่น/หยุดชั่วคราว"><svg class="ic i-pl" aria-hidden="true"><use href="#i-play"/></svg><svg class="ic i-pa" aria-hidden="true"><use href="#i-pause"/></svg></button>
          <button class="ic-btn big" data-act="next" aria-label="เพลงถัดไป"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
          <button class="ic-btn" data-act="repeat" aria-label="เล่นซ้ำ: ปิด"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg></button>
        </div>
      </div>
    </div>
    <div class="np-side">
      <div class="np-tabs" role="tablist">
        <button role="tab" data-act="nptab" data-nt="queue" class="on" aria-selected="true">ถัดไป</button>
        <button role="tab" data-act="nptab" data-nt="related" aria-selected="false">เกี่ยวข้อง</button>
      </div>
      <div id="npPanel" class="np-panel" role="tabpanel"></div>
    </div>
  </div>
</section>

<!-- The official YouTube player lives in here. It is attached once and never moved:
     the mini player and the full "now playing" view only change this box's CSS. -->
<div id="ph" aria-label="วิดีโอ"></div>

<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="../core.js?v=5"></script>
<script src="app.js?v=3"></script>
</body>
</html>
