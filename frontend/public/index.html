  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%PUBLIC_URL%/service-worker.js')
            .then(registration => {
              console.log('SW registered');
              // Check for updates periodically
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    // New SW active → reload to get fresh content
                    if (navigator.serviceWorker.controller) {
                      console.log('New SW activated, reloading for fresh content');
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch(error => console.log('SW registration failed'));
        });
        // Handle controller change (when new SW claims the page)
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('SW controller changed');
        });
      }
    </script>
  </body>
